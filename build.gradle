plugins {
id 'java-library'
id 'maven-publish'
id 'signing'
id 'io.spring.dependency-management' version '1.1.6'
}

group = 'io.github.dhruv1503'
version = '1.0.0'
description = 'Spring Boot starter for runtime usage analysis and dependency optimization'

java {
toolchain {
languageVersion = JavaLanguageVersion.of(21)
}
withSourcesJar()
withJavadocJar()
}

repositories {
mavenCentral()
}

ext {
springBootVersion = '3.3.5'
}

dependencies {
api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

api 'org.springframework.boot:spring-boot-autoconfigure'
compileOnly 'org.springframework.boot:spring-boot-actuator'
compileOnly 'com.fasterxml.jackson.core:jackson-databind'
annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

testImplementation 'org.springframework.boot:spring-boot-starter-test'
testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
testImplementation 'org.springframework.boot:spring-boot-starter-web'
}

tasks.withType(JavaCompile).configureEach {
options.encoding = 'UTF-8'
options.compilerArgs << '-parameters'
}

test {
useJUnitPlatform()
}

// Publishing configuration for Maven Central
publishing {
publications {
mavenJava(MavenPublication) {
from components.java

pom {
name = 'Boot Usage Spring Boot Starter'
description = project.description
url = 'https://github.com/dhruv-15-03/boot-usage'
inceptionYear = '2024'

licenses {
license {
name = 'Apache License, Version 2.0'
url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
}
}

developers {
developer {
id = 'dhruv1503'
name = 'Dhruv Rastogi'
email = 'dhruvrastogi2004@gmail.com'
url = 'https://github.com/dhruv-15-03'
}
}

scm {
connection = 'scm:git:git://github.com/dhruv-15-03/boot-usage.git'
developerConnection = 'scm:git:ssh://github.com/dhruv-15-03/boot-usage.git'
url = 'https://github.com/dhruv-15-03/boot-usage'
}

issueManagement {
system = 'GitHub Issues'
url = 'https://github.com/dhruv-15-03/boot-usage/issues'
}
}
}
}

repositories {
maven {
name = 'OSSRH'
def releasesRepoUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
credentials {
username = System.getenv('OSSRH_USERNAME') ?: ''
password = System.getenv('OSSRH_PASSWORD') ?: ''
}
}
maven {
name = 'GitHubPackages'
url = 'https://maven.pkg.github.com/dhruv-15-03/boot-usage'
credentials {
username = System.getenv('GITHUB_ACTOR') ?: ''
password = System.getenv('GITHUB_TOKEN') ?: ''
}
}
}
}

signing {
def signingKey = System.getenv('SIGNING_KEY')
def signingPassword = System.getenv('SIGNING_PASSWORD')
if (signingKey) {
useInMemoryPgpKeys(signingKey, signingPassword)
sign publishing.publications.mavenJava
}
}
